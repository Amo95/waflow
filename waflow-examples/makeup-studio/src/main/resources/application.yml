server:
  port: 8080

waflow:
  whatsapp:
    phone-number-id: ${PHONE_NUMBER_ID:123456789}
    access-token: ${ACCESS_TOKEN:your-access-token}
    verify-token: ${VERIFY_TOKEN:waflow-verify-2026}
    webhook-path: /webhook

  session:
    timeout: PT24H

  plugins:
    services:
      enabled: true

  payment:
    default-gateway: momo

spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

business:
